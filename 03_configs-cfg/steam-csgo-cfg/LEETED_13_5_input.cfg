// LEETED 13.2 - NACH der bisherigen autoexec laden, alle Tasten loslassen.
// Eigenstaendiger Eingabe-Fix; keine komplette Ersatz-autoexec.
// ALT: SPACE startete mjump/space_press_state/sprint0/refresh_crosshair.
// ALT: SPACE-Release unband das Rad, hatte aber kein -jump.
// NEU: Nur Wheel-Freigabe und feste Sensitivitaet; keine Menues/Waffen/Inspect.
alias "sens0" "sensitivity 1.33"
alias "sens1" "sens0"
alias "sensx" "sensitivity 1.87"
alias "sens2" "sensx"
alias "sens_normal" "sens0"
alias "sens_held" "sensx"
alias "sens_refresh" "sens0"
alias "+jumpp" "bind mwheeldown +jump;alias sens_refresh sensx;sensx"
alias "-jumpp" "unbind mwheeldown;-jump;alias sens_refresh sens0;sens0"
bind "scancode44" "+jumpp"
// NEU: Alte SPACE-Wrapper auf denselben kleinen Ablauf routen.
alias "+space_mode" "+jumpp"
alias "-space_mode" "-jumpp"
// NEU: Q behaelt Waffenwechsel, schreibt aber keine eigene Sensitivitaet.
// ALT: +qhand/-qhand nutzten sensx/sens0 und getrennte Halteflags.
alias "+qhand" "knife;look0;sens_refresh"
alias "-qhand" "best_weapon;sens_refresh"
alias "+quick" "knife;look0;sens_refresh"
alias "-quick" "best_weapon;sens_refresh"
alias "+quicky" "knife;look0;sens_refresh"
alias "-quicky" "best_weapon;sens_refresh"
bind "scancode20" "+qhand"
// NEU: Ducken nur auf linker STRG. Kein Toggle und keine Alias-Zustandskette.
// ALT: bind CTRL +profile_duck
option_duck_method 0
bind "scancode224" "+duck"
// ALT: bind b +duckjump
// ALT: bind MOUSE3 +mouse_duck
// NEU: Weitere Duck-Besitzer fuer diesen reduzierten Reparaturmodus deaktiviert.
unbind "scancode5"
unbind "mouse3"
// NEU: Alte Bewegungsmodi duerfen CTRL nicht erneut auf Aliase umbiegen.
alias "modemode_std" "bind scancode224 +duck;bind scancode225 +sprint"
alias "sneak_end" "modemode_std"
alias "movemode_sneak" "modemode_std"
alias "movemode_run" "modemode_std"
alias "sprint_mode" "modemode_std"
// NEU: Alte Duck-Besitzer explizit neutralisieren.
alias "duck_check_ctrl" "duck_check_b"
alias "duck_check_b" "duck_check_mouse"
alias "duck_check_mouse" "duck_end"
alias "sens_check_space" "sens_normal"
alias "sens_check_quick" "sens_normal"
alias "sens_check_qhand" "sens_normal"
alias "sens_check_quicky" "sens_normal"
// NEU: Kein SPACE/CapsLock-Sondermodus mehr.
alias "drop_dispatch" "bomb_down"
alias "space_move_hold" "noop"
// NEU: Start neutral; kein host_writeconfig waehrend der Diagnose.
unbind "mwheeldown"
-jump
-duck
-sprint
-lookatweapon
sens0
// Gewuenschter FOV bleibt erhalten; nur bei erlaubtem Serverkontext wirksam.
fov_cs_debug 90
alias "minimal_status" "bind scancode44;bind mwheeldown;bind scancode224;bind scancode20;sensitivity;option_duck_method"
echo LEETED_13_2_MINIMAL_READY

exec LEETED_13_5_cross.cfg
