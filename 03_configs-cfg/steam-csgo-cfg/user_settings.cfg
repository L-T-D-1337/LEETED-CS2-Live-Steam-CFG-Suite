// LEETED Benutzerprofil — nach der v10-Basis laden.
// Änderungen sind optional; diese Datei entsteht aus deiner Auswahl.
// ALT: alias "sens_normal" "sensitivity 1.33"
// NEU: Standard-Sensitivität aus dem Profil.
alias "sens_normal" "sensitivity 1.33"
// ALT: alias "sens_held" "sensitivity 1.87"
// NEU: Nur SPACE/Quickswitch-Haltezustände.
alias "sens_held" "sensitivity 1.33"
// NEU: Debug-FOV separat vom Viewmodel; nur in zulässigem Labor-Kontext.
fov_cs_debug 90
// ALT: alias "+jumpp" "mjump;sens0;+buy;space_press_state;select_held;sens_refresh"
// NEU: SPACE wählt keine Granate aus. BUY-Toggle bleibt erhalten.
// ALT: alias "+jumpp" "mjump;sens0;+buy;space_press_state;select_held;sens_refresh"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "+jumpp" "mjump;+buy;space_press_state;sens_refresh;refresh_crosshair"
// ALT: alias "space_press_state" "alias sens_check_space sens_held;alias check_space equip_z;alias drop_dispatch space_sneak_press"
// NEU: SPACE merkt Zustand ohne Granatenfallback.
// ALT: alias "space_press_state" "alias sens_check_space sens_held;alias check_space equip_z;alias drop_dispatch space_sneak_press"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "space_press_state" "alias sens_check_space sens_held;alias check_space best_weapon;alias drop_dispatch space_sneak_press;alias ctx_space ctx_red"
// ALT: alias "space_release_state" "alias sens_check_space sens_check_quick;alias check_space best_weapon;alias drop_dispatch bomb_down;space_sneak_reset"
// NEU: CapsLock und Schleichzustand beim Loslassen zurücksetzen.
// ALT: alias "space_release_state" "alias sens_check_space sens_check_quick;alias check_space best_weapon;alias drop_dispatch bomb_down;space_sneak_reset"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "space_release_state" "alias sens_check_space sens_check_quick;alias check_space best_weapon;alias drop_dispatch bomb_down;space_sneak_reset;alias ctx_space ctx_duck"
// NEU: sprint1/sprint0 bleiben aus der Basis. -speed ist dort ein SHIFT-Release, kein Ersatz für sprint1.
alias "profile_rgb" "cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0"
// ALT: alias "selected_color" "rgb_red"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "selected_color" "profile_rgb"
// ALT: alias "croco" "rgb_red"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "croco" "profile_rgb"
alias "ctx_red" "cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0"
alias "ctx_green" "cl_crosshaircolor_r 0;cl_crosshaircolor_g 255;cl_crosshaircolor_b 0"
alias "ctx_base" "selected_color"
alias "ctx_space" "ctx_duck"
alias "ctx_duck" "ctx_walk"
alias "ctx_walk" "ctx_base"
alias "ctx_refresh" "ctx_base"
alias "ctx_space_active" "ctx_duck"
alias "ctx_duck_active" "ctx_walk"
alias "ctx_walk_active" "ctx_base"
// ALT: alias "space_press_state" "alias sens_check_space sens_held;alias check_space equip_z;alias drop_dispatch space_sneak_press"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "space_press_state" "alias sens_check_space sens_held;alias check_space best_weapon;alias drop_dispatch space_sneak_press;alias ctx_space ctx_space_active"
// ALT: alias "space_sneak_on" "sprint0;alias space_sneak_toggle space_sneak_off;alias space_move_hold sprint0;echo SPACE_SPRINT0"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "space_sneak_on" "sprint0;alias space_sneak_toggle space_sneak_off;alias space_move_hold sprint0;alias ctx_walk ctx_walk_active;refresh_crosshair"
// ALT: alias "space_sneak_off" "sprint1;alias space_sneak_toggle space_sneak_on;alias space_move_hold sprint1;echo SPACE_SPRINT1"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "space_sneak_off" "sprint1;alias space_sneak_toggle space_sneak_on;alias space_move_hold sprint1;alias ctx_walk ctx_base;refresh_crosshair"
// ALT: alias "space_sneak_reset" "sprint1;alias space_sneak_toggle space_sneak_on;alias space_move_hold noop"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "space_sneak_reset" "sprint1;alias space_sneak_toggle space_sneak_on;alias space_move_hold noop;alias ctx_walk ctx_base"
// NEU: Optionale Duckfarbe am bestehenden CTRL-Haltebind; B bleibt in der Basis.
alias "+profile_duck" "+sneak;alias ctx_duck ctx_duck_active;refresh_crosshair"
alias "-profile_duck" "-sneak;alias ctx_duck ctx_walk;refresh_crosshair"
// ALT: bind CTRL +sneak
bind CTRL +profile_duck
// NEU: Groesserer weisser Schusskreis: Gap 8 statt 4. Dynamische Spreizung bleibt aus v10.
// ALT: alias "shape_fire" "shot_circle_part_1;shot_circle_part_2;shot_circle_part_3;shot_circle_part_4"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "shape_fire" "shot_circle_part_1;shot_circle_part_2;shot_circle_part_3;shot_circle_part_4;profile_circle_size"
alias "profile_circle_size" "cl_crosshair_length 2;cl_crosshair_gap 8;cl_crosshair_thickness 1"
inspect_off
color_lock_on
shot_circle
shot_on
// ALT: alias "color_restore" "selected_color"
// NEU: Profilwert/Zustandsfunktion aus dem Benutzerpanel; siehe Guide.
alias "color_restore" "ctx_refresh"
look0;hand>;sens_refresh;refresh_crosshair
echo LEETED_PROFILE_LOAD
//c

engine_low_latency_sleep_after_client_tick true;viewmodel_fov 54; viewmodel_offset_x -2.5; viewmodel_offset_y -2.5; viewmodel_offset_z -1.5; viewmodel_presetpos 1;snd_mixahead 0.02;r_fullscreen_gamma 2.3;r_drawtracers false;-attack;alias mycross "";cl_show_observer_crosshair 0;fov_cs_debug 90;bind r viewmodel_fov 54;snd_mixahead 0.02;fov_cs_debug 90;r_drawtracers_firstperson FALSE;r_drawparticles false;host_writeconfig