// NEU: Release-Protokoll nach Wiederherstellung.
alias "shot_up_report" "echo LEETED_SHOT_UP_END;selection_status;shot_values"
// NEU: Schussdiagnose bei Bedarf einschalten.
alias "shot_trace_on" "log_flags General -donotecho;alias shot_trace_down shot_down_report;alias shot_trace_up shot_up_report;echo LEETED_SHOT_TRACE_ON"
// NEU: Schussdiagnose abschalten.
alias "shot_trace_off" "alias shot_trace_down noop;alias shot_trace_up noop"
// NEU: Binding und Crosshair-Werte abfragen.
alias "shot_status" "log_flags General -donotecho;echo LEETED_SHOT_STATUS;selection_status;bind mouse1;bind k;shot_values"
// NEU: Schussdiagnose gemaess options.json initialisieren.
shot_trace_off
