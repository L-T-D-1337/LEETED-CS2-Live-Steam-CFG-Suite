// LEETED 13.3: NACH v13 und dem SPACE-Minimal-Fix laden.
// NEU: Eingebautes Granaten-Crosshair fuer alle Granaten, ohne Spieler-Overlay.
cl_grenadecrosshair_keepusercrosshair false
cl_grenadecrosshair_decoy true
cl_grenadecrosshair_explosive true
cl_grenadecrosshair_fire true
cl_grenadecrosshair_flash true
cl_grenadecrosshair_smoke true
cl_grenadecrosshairdelay_decoy 0
cl_grenadecrosshairdelay_explosive 0
cl_grenadecrosshairdelay_fire 0
cl_grenadecrosshairdelay_flash 0
cl_grenadecrosshairdelay_smoke 0
// ALT: alias "refresh_crosshair" "crosshair_idle"
// ALT: alias "crosshair_idle" "cross_saved"
// NEU: Waffen/Kaufen/Granaten duerfen keine gespeicherte Form erneut anwenden.
alias "refresh_crosshair" ""
alias "crosshair_idle" ""
alias "crosshair_fire" ""
alias "shot_render" ""
alias "croattx" ""
alias "mycross" ";"
// NEU: Nur ausdrueckliche Profilwahl zeichnet die ausgewaehlte Form.
// ALT: crossdot/crosscross/crosshole/crosst/trill endeten auf refresh_crosshair.
alias "crossdot" "alias cross_saved restore_dot;alias gmrcrossnow shape_dot;alias selection_status selected_dot;cross_saved"
alias "crosscross" "alias cross_saved restore_cross;alias gmrcrossnow shape_cross;alias selection_status selected_cross;cross_saved"
alias "crosshole" "alias cross_saved restore_hole;alias gmrcrossnow shape_hole;alias selection_status selected_hole;cross_saved"
alias "crosst" "alias cross_saved restore_t;alias gmrcrossnow shape_t;alias selection_status selected_t;cross_saved"
alias "trill" "alias cross_saved restore_trill;alias gmrcrossnow shape_trill;alias selection_status selected_trill;cross_saved"
// NEU: Farbwahl aendert nur Farbe, nicht Groesse/Form oder den Zyklus.
alias "c_hell" "alias selected_color rgb_white;alias croco rgb_white;selected_color"
alias "c_matrix" "alias selected_color rgb_matrix;alias croco rgb_matrix;selected_color"
alias "c_npink" "alias selected_color rgb_pink;alias croco rgb_pink;selected_color"
alias "c_nweed" "alias selected_color rgb_weed;alias croco rgb_weed;selected_color"
alias "c_nred" "alias selected_color rgb_red;alias croco rgb_red;selected_color"
alias "c_ntkys" "alias selected_color rgb_cyan;alias croco rgb_cyan;selected_color"
// ALT: alias "best_weapon" "look0;slot3;slot2;slot1;hand>;refresh_crosshair"
alias "best_weapon" "look0;slot3;slot2;slot1;hand>"
// ALT: equip_z/equip_x/equip_c/equip_f endeten auf refresh_crosshair.
alias "equip_z" "<hand;slot7;slot6;slot10;slot8;look1"
alias "equip_x" "<hand;slot8;slot7;slot6;slot10;look1"
alias "equip_c" "<hand;slot10;slot8;slot7;slot6;look1"
alias "equip_f" "<hand;slot6;slot10;slot8;slot7;look1"
// ALT: alias "rdygo" "fire_cancel;he;molo;smoke;slot3;knife;look0"
// NEU: Kaufhelfer schaltet nicht durch mehrere Granaten. Messer-Endzustand bleibt.
alias "rdygo" "knife;look0"
// NEU: Kein Profil anwenden und next_cross NICHT zuruecksetzen beim Laden!
alias "cross_status" "selection_status;alias next_cross;alias cross_saved;cl_crosshair_length;cl_crosshair_gap;cl_crosshair_thickness;cl_grenadecrosshair_keepusercrosshair"
echo LEETED_13_3_CROSSHAIR_READY

exec LEETED_13_5_final.cfg
