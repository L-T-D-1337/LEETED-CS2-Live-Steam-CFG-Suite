// LEETED 13.5: letzter Block der vollstaendigen Ladekette.
// NEU: Nur hier werden die neuen Eingabevertraege aktiviert.
// NEU: Sens-Prioritaet Schuss (1.33) > SPACE (1.87) > normal (1.33).
alias "sens0" "sensitivity 1.33"
alias "sens1" "sens0"
alias "sensx" "sensitivity 1.87"
alias "sens_space" "sens0"
alias "sens_shot" "sens_space"
// ALT: alias "sens_refresh" "sens0"
alias "sens_refresh" "sens_shot"
// NEU: Schuss-Vorrang wird beim Schuss gesetzt, nicht beim SPACE-Wechsel.
alias "sens_guard" "noop"
alias "space_down_log" "echo SPACE_DOWN_EXPECT_1.87_OR_SHOT_1.33;sensitivity"
alias "space_up_log" "echo SPACE_UP_EXPECT_1.33;sensitivity"
alias "sens_trace_on" "alias space_down_trace space_down_log;alias space_up_trace space_up_log"
alias "sens_trace_off" "alias space_down_trace noop;alias space_up_trace noop"
alias "space_down_trace" "space_down_log"
alias "space_up_trace" "space_up_log"
alias "sens_status" "bind scancode44;bind mouse1;sensitivity;alias +jumpp;alias -jumpp;alias sens_space;alias sens_shot;alias sens_guard"
// NEU: Q reagiert auch bei bereits gehaltenem Q auf SPACE-Wechsel.
alias "quick_pistol" "look0;slot3;slot2;look1"
alias "quick_knife" "look0;slot3;look1"
alias "quick_choice" "quick_pistol"
alias "quick_held" "noop"
// ALT: alias "+jumpp" "bind mwheeldown +jump;alias sens_refresh sensx;sensx"
// ALT: alias "+jumpp" "bind mwheeldown +jump;alias sens_space sensx;alias quick_choice quick_knife;quick_held;sens_refresh"
// NEU 13.5: Aktuellen Sens-Wert ohne Ruecklesen der gerade geaenderten Aliaswahl setzen.
alias "+jumpp" "bind mwheeldown +jump;alias sens_space sensx;alias quick_choice quick_knife;quick_held;sensitivity 1.87;sens_guard;space_down_trace"
// ALT: alias "-jumpp" "unbind mwheeldown;-jump;alias sens_refresh sens0;sens0"
// ALT: alias "-jumpp" "unbind mwheeldown;-jump;alias sens_space sens0;alias quick_choice quick_pistol;quick_held;sens_refresh"
// NEU 13.5: Aktuellen Sens-Wert ohne Ruecklesen der gerade geaenderten Aliaswahl setzen.
alias "-jumpp" "unbind mwheeldown;-jump;alias sens_space sens0;alias quick_choice quick_pistol;quick_held;sensitivity 1.33;space_up_trace"
bind "scancode44" "+jumpp"
// ALT: alias "+qhand" "knife;look0;sens_refresh"
// ALT: alias "-qhand" "best_weapon;sens_refresh"
alias "+qhand" "alias quick_held quick_choice;quick_choice;sens_refresh"
alias "-qhand" "alias quick_held noop;best_weapon;sens_refresh"
alias "+quick" "+qhand"
alias "-quick" "-qhand"
alias "+quicky" "+qhand"
alias "-quicky" "-qhand"
bind "scancode20" "+qhand"
// NEU: Inspect nach dem jeweiligen Slotwechsel; -lookatweapon gibt Eingabe frei.
alias "look0" "-lookatweapon"
alias "look1" "+lookatweapon"
// ALT: alias ">c4" "<hand;look1;slot5"
alias ">c4" "<hand;slot5;look1"
alias "c4" ">c4"
// ALT: alias "+c4" ">c4;slot8"
alias "+c4" ">c4"
// ALT: alias "-c4" "ch1;w1;w2;look0"
alias "-c4" "best_weapon;sens_refresh"
// ALT: bind "5" "slot5"
bind "scancode34" ">c4"
// NEU: Auch direkte Zahlentasten benutzen die Inspect-Granatenhelfer.
bind "scancode35" "he"
bind "scancode36" "flash"
bind "scancode37" "smoke"
bind "scancode38" "deco"
bind "scancode39" "molo"
bind "scancode32" "slot4;look1"
// NEU: Frueheres weisses Dynamic-Circle-Profil, einschliesslich Gap 8.
alias "shot_circle_now" "shot_circle_part_1;shot_circle_part_2;shot_circle_part_3;shot_circle_part_4;profile_circle_size;cl_crosshair_recoil 1"
alias "cross_idle_apply" "cross_saved;cl_crosshair_recoil 0"
alias "cross_apply" "cross_idle_apply"
// ALT: bind "mouse1" "+attack"
// NEU: Angriff und Anzeige besitzen denselben Press-/Release-Weg.
bind "mouse1" "+fire"
// NEU: Alte Angriffspfade auf dieselbe Freigabe routen; Enter bleibt Chat.
alias "+atx" "+fire"
alias "-atx" "-fire"
// NEU: Formwahl speichert neue Auswahl; bei gehaltenem Schuss bleibt Kreis sichtbar.
// ALT: Profilwahl endete auf cross_saved.
alias "crossdot" "alias cross_saved restore_dot;alias gmrcrossnow shape_dot;alias selection_status selected_dot;cross_apply"
alias "crosscross" "alias cross_saved restore_cross;alias gmrcrossnow shape_cross;alias selection_status selected_cross;cross_apply"
alias "crosshole" "alias cross_saved restore_hole;alias gmrcrossnow shape_hole;alias selection_status selected_hole;cross_apply"
alias "crosst" "alias cross_saved restore_t;alias gmrcrossnow shape_t;alias selection_status selected_t;cross_apply"
alias "trill" "alias cross_saved restore_trill;alias gmrcrossnow shape_trill;alias selection_status selected_trill;cross_apply"
// NEU: Farbe wechseln waehrend des Schusses speichert Farbe, Kreis bleibt weiss.
alias "color_apply" "selected_color"
alias "color_shot" "shot_circle_now"
// ALT: alias "+fire" "look0;+attack;alias sens_shot sens0;alias cross_apply shot_circle_now;alias color_apply color_shot;shot_circle_now;sens_refresh"
// NEU 13.5: Aktuellen Sens-Wert ohne Ruecklesen der gerade geaenderten Aliaswahl setzen.
alias "+fire" "look0;+attack;alias sens_shot sens0;alias sens_guard sens0;alias cross_apply shot_circle_now;alias color_apply color_shot;shot_circle_now;sensitivity 1.33"
// ALT: alias "-fire" "-attack;alias sens_shot sens_space;alias cross_apply cross_idle_apply;alias color_apply selected_color;cross_idle_apply;sens_refresh"
// NEU 13.5: Aktuellen Sens-Wert ohne Ruecklesen der gerade geaenderten Aliaswahl setzen.
alias "-fire" "-attack;alias sens_shot sens_space;alias sens_guard noop;alias cross_apply cross_idle_apply;alias color_apply selected_color;cross_idle_apply;sens_space"
alias "c_hell" "alias selected_color rgb_white;alias croco rgb_white;color_apply"
alias "c_matrix" "alias selected_color rgb_matrix;alias croco rgb_matrix;color_apply"
alias "c_npink" "alias selected_color rgb_pink;alias croco rgb_pink;color_apply"
alias "c_nweed" "alias selected_color rgb_weed;alias croco rgb_weed;color_apply"
alias "c_nred" "alias selected_color rgb_red;alias croco rgb_red;color_apply"
alias "c_ntkys" "alias selected_color rgb_cyan;alias croco rgb_cyan;color_apply"
alias "color_restore" "selected_color"
// NEU: Kaufen/Granaten/Rueckwege rufen weder cross_apply noch next_cross auf.
// Native Granatenanzeige mit keepusercrosshair false bleibt aus Block cross.cfg.
// NEU: Neutraler Start nach allen Altdefinitionen, Inspect-Modus aktiviert.
-attack
-attack2
-jump
-duck
-lookatweapon
unbind "mwheeldown"
option_duck_method 0
bind "scancode224" "+duck"
inspect_on
cl_crosshair_recoil 0
sens0
// NEU: Eindeutiger Einstieg auch fuer den bestehenden fix-Alias.
alias "fix" "exec LEETED_13_5.cfg"
alias "status135" "bind scancode44;bind scancode20;bind scancode224;bind mouse1;bind mwheeldown;sensitivity;cl_crosshair_recoil;selection_status"
alias "duck_status" "bind scancode224;bind scancode5;bind mouse3;option_duck_method"
echo LEETED_v1.01.1_13_5_END
duck_status

// NEU: 13.6 wird erst nach allen Basisdefinitionen geladen.
exec LEETED_13_6_MINIMAL.cfg
