// LEETED 13.9: nur Schussstil und vierter Crosshair-Auswahlplatz.
// ALT: alias "shot_circle_part_1" "crosshair 1;cl_crosshairstyle 1;cl_crosshair_length 2;cl_crosshair_thickness 1;cl_crosshair_gap 4;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 0;cl_crosshairdot 1"
// NEU: Schuss: Dynamische Kreissegmente (Style 7) statt Dynamic Circle (Style 1).
alias "shot_circle_part_1" "crosshair 1;cl_crosshairstyle 7;cl_crosshair_length 2;cl_crosshair_thickness 1;cl_crosshair_gap 4;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 0;cl_crosshairdot 1"
// ALT: alias "shot_circle_part_2" "cl_crosshair_t 1;cl_crosshair_recoil 1;cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;cl_crosshaircolor_b 255;cl_crosshair_dynamic_spread_limit 255"
// NEU: Vollstaendige vierteilige Form, kein ausgeblendeter oberer Balken.
alias "shot_circle_part_2" "cl_crosshair_t 0;cl_crosshair_recoil 1;cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;cl_crosshaircolor_b 255;cl_crosshair_dynamic_spread_limit 255"
// NEU: Kompaktes dynamisches Auswahlprofil; anpassbar in settings.json.
alias "quad_part_1" "crosshair 1;cl_crosshairstyle 7;cl_crosshair_length 2;cl_crosshair_thickness 1;cl_crosshair_gap 8;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 0"
// NEU: Kompaktes dynamisches Auswahlprofil; anpassbar in settings.json.
alias "quad_part_2" "cl_crosshairdot 1;cl_crosshair_t 0;cl_crosshair_recoil 0;cl_crosshair_dynamic_spread_limit 255;cl_crosshair_screen_height 960"
// NEU: Dynamische Kreissegmente fuer die normale Auswahl.
alias "shape_quad" "quad_part_1;quad_part_2"
// NEU: Gespeicherte Farbe wiederherstellen; ausserhalb Schuss Recoil aus.
alias "restore_quad" "shape_quad;color_restore;cl_crosshair_recoil 0;ch1"
// NEU: Status der tatsaechlichen Auswahl.
alias "selected_quad" "echo CROSS_SELECTED_DYNAMIC_QUAD"
// NEU: Direkt rendern; Schuss-Guard erhalten; im Ring Platz 4.
alias "crossquad" "alias cross_saved restore_quad;alias gmrcrossnow shape_quad;alias selection_status selected_quad;restore_quad;selection_shot_guard;alias prev_cross crosscross;alias next_cross cross1"
// ALT: alias "cross4" "crosst;alias next_cross cross1"
// NEU: Grosser T-Auswahlplatz ersetzt; crosst selbst bleibt unveraendert.
alias "cross4" "crossquad;alias next_cross cross1"
// ALT: alias "crosshole" "alias cross_saved restore_hole;alias gmrcrossnow shape_hole;alias selection_status selected_hole;restore_hole;selection_shot_guard;alias prev_cross crosst;alias next_cross cross2"
// NEU: Rueckwaerts vom ersten Profil zu Kreissegmenten.
alias "crosshole" "alias cross_saved restore_hole;alias gmrcrossnow shape_hole;alias selection_status selected_hole;restore_hole;selection_shot_guard;alias prev_cross crossquad;alias next_cross cross2"
// ALT: alias "trill" "alias cross_saved restore_trill;alias gmrcrossnow shape_trill;alias selection_status selected_trill;restore_trill;selection_shot_guard;alias prev_cross crosst;alias next_cross cross1"
// NEU: Auch vom manuell erreichbaren Trill kein Rueckweg zum grossen T im Zyklus.
alias "trill" "alias cross_saved restore_trill;alias gmrcrossnow shape_trill;alias selection_status selected_trill;restore_trill;selection_shot_guard;alias prev_cross crossquad;alias next_cross cross1"
// ALT: alias "fix" "exec LEETED_13_8.cfg"
// NEU: Neuladen des aktuellen Gesamteinstiegs.
alias "fix" "exec LEETED_13_9.cfg"

// LEETED 14: explizite Press-/Release-Vertraege.
alias "q_lock" "alias q_up q_keep"
alias "q_can_lock" "q_lock"
alias "q_mark" "q_can_lock"
alias "q_fire_gate" "noop"
alias "q_space_gate" "noop"
alias "q_normal_gate" "noop"
alias "q_up" "best_weapon"
// NEU: Keine neue Waffenwahl beim Q-Release nach Angriff.
alias "q_keep" "look0;hand>"
// NEU: Manuelle Waffenwahl hat Vorrang vor spaeterem Q-Release.
alias "q_cancel" "alias q_up noop;alias q_fire_gate noop;alias quick_held noop;alias q_space_gate noop;alias q_normal_gate noop"
// ALT: alias "quick_pistol" "look0;slot3;slot2"
alias "quick_pistol" "look0;slot3;slot2;alias q_can_lock q_lock"
// ALT: alias "quick_knife" "look0;slot3;look1"
alias "quick_knife" "look0;slot3;look1;alias q_can_lock noop;alias q_up best_weapon"
