alias "+qhand" "alias q_up best_weapon;alias q_fire_gate q_mark;alias q_space_gate quick_knife;alias q_normal_gate quick_pistol;alias quick_held quick_choice;quick_choice;sens_refresh"
// ALT: alias "-qhand" "alias quick_held noop;best_weapon;sens_refresh"
alias "-qhand" "alias quick_held noop;alias q_space_gate noop;alias q_normal_gate noop;q_up;alias q_fire_gate noop;alias q_up best_weapon;sens_refresh"
// ALT: alias "+fire" "look0;+attack;alias sens_shot sens0;alias sens_guard sens0;alias cross_apply shot_circle_now;alias color_apply color_shot;shot_circle_now;sensitivity 1.33;alias selection_shot_guard shot_circle_now"
// NEU: Angriffsdruck als Proxy; keine Kenntnis ueber tatsaechlich verschossene Kugel.
alias "+fire" "look0;+attack;alias sens_shot sens0;alias sens_guard sens0;alias cross_apply shot_circle_now;alias color_apply color_shot;shot_circle_now;sensitivity 1.33;alias selection_shot_guard shot_circle_now;q_fire_gate"
alias "jump_check_b" "jump_check_n"
alias "jump_check_n" "-jump"
alias "jump_b_state" "-jump"
alias "+jump_n" "alias jump_check_n +jump;+jump"
alias "-jump_n" "alias jump_check_n -jump;jump_b_state"
// ALT: alias "+jumpp" "bind mwheeldown +jump;alias sens_space sensx;alias quick_choice quick_knife;quick_held;sensitivity 2.1;sens_guard;space_down_trace"
// NEU: Gehaltenes Q direkt auf Messer umstellen ohne alten dynamischen Auswahlzeiger.
alias "+jumpp" "bind mwheeldown +jump;alias sens_space sensx;alias quick_choice quick_knife;q_space_gate;sensitivity 2.1;sens_guard;space_down_trace"
// ALT: alias "-jumpp" "unbind mwheeldown;-jump;alias sens_space sens0;alias quick_choice quick_pistol;quick_held;sensitivity 1.33;space_up_trace"
