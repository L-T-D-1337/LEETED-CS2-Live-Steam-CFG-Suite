alias "+buy" "alias jump_check_b +jump;alias jump_b_state +jump;+jump;alias buy_check_b noop;+quickbuyradial"
// ALT: alias "-buy" "buy_close;buy_finish"
alias "-buy" "alias jump_check_b jump_check_n;alias jump_b_state -jump;jump_check_n;alias buy_check_b buy_rad_finish;buy_check_e"
