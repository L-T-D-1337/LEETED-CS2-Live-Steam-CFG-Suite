// LEETED v1.01.1_13 - finaler Fixblock, automatisch zuletzt geladen.
// Vor dem Laden alle Spieltasten loslassen. Im Hauptmenue laden.
// NEU: Direkter Angriff, kein Schuss-Crosshair und kein Release-Schuss.
-attack
-attack2
-zoom
// ALT: bind mouse1 +atx
bind "mouse1" "+attack"
// ALT: bind "MOUSE2" "+holdzoom"
// NEU: Nativer sekundaerer Angriff fuer Zoom und andere Waffen.
bind "mouse2" "+attack2"
// ALT: bind enter +enter_fire
// NEU: Zweiten Angriffsbesitzer entfernen; Enter oeffnet den Chat.
bind "enter" "messagemode"
// NEU: Kein alter Abbruchhelfer darf direkten Maus1-Angriff beenden.
alias "fire_cancel" "noop"
alias "fire_refresh" "noop"
alias "fire_end" "noop"
alias "fire_hold" "noop"
// ALT: alias "mycross" "restore_dot"
// NEU: Expliziter Nutzerfix; Profilwahl nutzt getrennt cross_saved.
alias "mycross" ";"
alias "crosshair_idle" "cross_saved"
alias "refresh_crosshair" "crosshair_idle"
// NEU: Keine reaktivierbare Schussanzeige in diesem Profil.
alias "shot_on" "echo SHOT_DISABLED_NATIVE_ATTACK"
alias "shot_toggle" "shot_off"
shot_off
// ALT: bind "space" "+space_mode"
// ALT: bind "space" "sensitivity 1.33"
// NEU: Korrektur 13.1: urspruenglicher Wheeljump-Haltemodus auf SPACE.
// ALT: alias "+jumpp" "mjump;+buy;space_press_state;sens_refresh;refresh_crosshair"
// NEU: Kein Buymenu-Toggle: Menuefokus kann den Release unterbrechen.
alias "+jumpp" "mjump;space_press_state;sprint0;sens_refresh;refresh_crosshair"
// ALT: alias "-jumpp" "mnormal;sensx;-buy;space_release_state;best_weapon;proview;sens_refresh"
// NEU: Wheel sofort freigeben; eigene Zustandsfreigabe und zentraler Rueckweg.
alias "-jumpp" "unbind mwheeldown;mnormal;space_release_state;best_weapon;proview;sens0;sens_refresh;unbind mwheeldown"
bind "space" "+jumpp"
// NEU: Nutzerwunsch aktiv; Engine-/Serverrechte bleiben erforderlich.
fov_cs_debug 90
alias "sens0" "sens1"
alias "sens1" "sensitivity 1.33;zoom_sensitivity_ratio 0.8189833027098955"
// NEU: SPACE/Q halten 1.87; erst wenn beide losgelassen sind wieder 1.33.
alias "sens_check_space" "sens_check_quick"
alias "sens_check_quick" "sens_check_qhand"
alias "sens_check_qhand" "sens_check_quicky"
alias "sens_check_quicky" "sens_normal"
// NEU: Uebernommene native Sprungtaste N; Wheel nach SPACE-Umbau neutral.
unbind "mwheeldown"
bind "n" "+jump"
-jump
-duck
-lookatweapon
// NEU: Nativen Jump nicht durch Loslassen einer zweiten Sprungtaste abbrechen.
// ALT: bind b +duckjump
// NEU: B ist einzelnes Ducken; Duckjump manuell B+N, keine Mehrfacheingabe.
alias "+duckjump" "alias duck_check_b duck_hold;duck_refresh"
alias "-duckjump" "alias duck_check_b duck_check_mouse;duck_refresh"
bind "b" "+duckjump"
alias "b_duckjump" "echo MANUAL_DUCKJUMP_B_PLUS_N"
// NEU: Keine zweite native Sprungtaste ueber den bisherigen Umschalter.
alias "b_jump" "echo JUMP_KEY_N"
engine_low_latency_sleep_after_client_tick true
snd_mixahead 0.02
r_fullscreen_gamma 2.3
r_drawtracers_firstperson false
// ALT: viewmodel_offset_x -2.5
// ALT: viewmodel_offset_y -2.5
// NEU: Dumpbereich X/Y mindestens -2. Preset VOR Einzelwerten.
alias "proview" "viewmodel_presetpos 1;viewmodel_fov 68;viewmodel_offset_x -2;viewmodel_offset_y -2;viewmodel_offset_z -1.5"
proview
// NEU: Bestehende Werte wurden von der Engine ohnehin begrenzt.
// ALT: hud_scaling "1.1337"
hud_scaling 1.1
// ALT: safezonex "1.1337"
safezonex 1
inspect_off
trace_off
shot_trace_off
sens0
cross_saved
// NEU: Status liest tatsaechliche Werte, kein erfundener Testerfolg.
alias "status13" "bind space;bind mouse1;bind mouse2;bind b;bind n;sensitivity;snd_mixahead;r_fullscreen_gamma;r_drawtracers_firstperson"
alias "view13" "viewmodel_presetpos;viewmodel_fov;viewmodel_offset_x;viewmodel_offset_y;viewmodel_offset_z"
alias "fix" "exec LEETED_13_5.cfg"
echo LEETED_v1.01.1_13_1_END

exec LEETED_13_5_input.cfg
