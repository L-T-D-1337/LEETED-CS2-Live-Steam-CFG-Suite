// LEETED v1.01.1_15: gezieltes Update auf unveraenderter v14-Basis.
// Nur mit freien Tasten im Hauptmenue laden. Kein nativer CS2-Test.

// NEU: Empfangsmute und eigenes Sprechen sind getrennte Zustaende.
// ALT: voice_clutch = -voicerecord;cl_clutch_mode 1
// ALT: voice_talk = cl_clutch_mode 0;+voicerecord
alias "v15_voice_normal" "snd_voipvolume 0.5"
alias "v15_voice_low" "snd_voipvolume 0.1"
alias "v15_voice_zero" "snd_voipvolume 0"
alias "v15_voice_level" "v15_voice_normal"
alias "v15_voice_low_gate" "v15_voice_low"
alias "v15_voice_normal_gate" "v15_voice_normal"
alias "v15_mute_on" "alias v15_voice_low_gate v15_voice_zero;alias v15_voice_normal_gate v15_voice_zero;alias v15_mute_toggle v15_mute_off;v15_voice_zero;echo VOICE_RECEIVE_MUTED"
alias "v15_mute_off" "alias v15_voice_low_gate v15_voice_low;alias v15_voice_normal_gate v15_voice_normal;alias v15_mute_toggle v15_mute_on;v15_voice_level;echo VOICE_RECEIVE_UNMUTED"
alias "v15_mute_toggle" "v15_mute_on"
alias "v15_talk_down" "+voicerecord;alias v15_voice_level v15_voice_low;v15_voice_low_gate;alias v15_voice_release v15_talk_up"
alias "v15_talk_up" "-voicerecord;alias v15_voice_level v15_voice_normal;v15_voice_normal_gate;alias v15_voice_release noop"
alias "v15_mute_key" "v15_mute_toggle;alias v15_voice_release noop"
alias "v15_voice_press" "v15_talk_down"
alias "v15_voice_release" "noop"
// ALT: voice_alt_on/off wechselten auch bei bereits gehaltenem V den Mikrofonzustand.
alias "voice_alt_on" "alias v15_voice_press v15_mute_key"
alias "voice_alt_off" "alias v15_voice_press v15_talk_down"
alias "+voice_key" "v15_voice_press"
alias "-voice_key" "v15_voice_release"
// ALT: 1voicevol/0voicevol ueberschrieben snd_voipvolume beim ALT-Wechsel.
alias "1voicevol" "volume 0.22"
alias "0voicevol" "stdv"
// NEU: Kompatible manuelle Mute-/Voice-Einstiege ohne natives Clutchmode.
alias "xmute" "v15_mute_on"
alias "voice" "v15_mute_off"
alias "voice_clutch" "v15_mute_on"
alias "voice_talk" "v15_talk_down"
cl_clutch_mode 0
-voicerecord
v15_voice_normal

// NEU: Haupt-Kaufmenue. Der native buymenu-Befehl ist ein Toggle.
// Vor dem ersten Oeffnen schliessen; die zweite gehaltene Taste toggelt NICHT erneut.
// ALT: buy_rad_finish = -quickbuyradial;buy_finish
alias "v15_buy_open" "cancelselect;gameui_hide;buymenu"
alias "v15_buy_open_if_b" "v15_buy_open"
alias "v15_buy_open_if_e" "v15_buy_open"
alias "buy_rad_finish" "cancelselect;gameui_hide;buy_finish"
alias "buy_check_b" "buy_rad_finish"
alias "buy_check_e" "buy_rad_finish"
// ALT: +buy = alias jump_check_b +jump;alias jump_b_state +jump;+jump;alias buy_check_b noop;+quickbuyradial
alias "+buy" "alias jump_check_b +jump;alias jump_b_state +jump;+jump;alias buy_check_b noop;v15_buy_open_if_e;alias v15_buy_open_if_b noop"
// ALT: -buy = alias jump_check_b jump_check_n;alias jump_b_state -jump;jump_check_n;alias buy_check_b buy_rad_finish;buy_check_e
alias "-buy" "alias jump_check_b jump_check_n;alias jump_b_state -jump;v15_jump_release_b;alias buy_check_b buy_rad_finish;alias v15_buy_open_if_b v15_buy_open;buy_check_e"
// ALT: +use_buy = use_prepare;alias buy_check_e noop;+use;+quickbuyradial
alias "+use_buy" "use_prepare;alias buy_check_e noop;+use;v15_buy_open_if_b;alias v15_buy_open_if_e noop"
// ALT: -use_buy = -use;alias buy_check_e buy_rad_finish;buy_check_b
alias "-use_buy" "-use;alias buy_check_e buy_rad_finish;alias v15_buy_open_if_e v15_buy_open;buy_check_b"
-quickbuyradial
cl_use_opens_buy_menu false

// NEU: Getrennte ATX-Form/Farbe. Auswahlzeiger werden nur durch Auswahl geaendert.
alias "v15_atx_circle" "shot_circle_part_1;shot_circle_part_2;shot_circle_part_3;shot_circle_part_4;profile_circle_size;cl_crosshair_recoil 1"
alias "v15_atx_dynamic" "v15_atx_circle;cl_crosshairstyle 2;cl_crosshair_dynamic_splitalpha_innermod 1;cl_crosshair_dynamic_splitalpha_outermod 1;cl_crosshair_dynamic_splitdist 7"
alias "v15_atx_dynamic_circle" "v15_atx_circle;cl_crosshairstyle 1"
alias "v15_atx_shape" "v15_atx_circle"
alias "v15_atx_white" "cl_crosshaircolor 5;rgb_white"
alias "v15_atx_cyan" "cl_crosshaircolor 5;rgb_cyan"
alias "v15_atx_green" "cl_crosshaircolor 5;rgb_weed"
alias "v15_atx_pink" "cl_crosshaircolor 5;rgb_pink"
alias "v15_atx_color" "v15_atx_white"
// ALT: shot_circle_now = shot_circle_part_1;shot_circle_part_2;shot_circle_part_3;shot_circle_part_4;profile_circle_size;cl_crosshair_recoil 1
alias "shot_circle_now" "v15_atx_shape;v15_atx_color;cl_crosshair_recoil 1"
alias "v15_render_circle" "v15_atx_circle;v15_atx_color"
alias "v15_render_dynamic" "v15_atx_dynamic;v15_atx_color"
alias "v15_render_split" "v15_atx_dynamic_circle;v15_atx_color"
alias "v15_atx_select_circle" "alias v15_atx_shape v15_atx_circle;alias v15_atx_next_style v15_atx_select_dynamic;v15_preview_circle;echo ATX_STYLE_CIRCLE_7"
alias "v15_atx_select_dynamic" "alias v15_atx_shape v15_atx_dynamic;alias v15_atx_next_style v15_atx_select_split;v15_preview_dynamic;echo ATX_STYLE_DYNAMIC_2"
alias "v15_atx_select_split" "alias v15_atx_shape v15_atx_dynamic_circle;alias v15_atx_next_style v15_atx_select_circle;v15_preview_split;echo ATX_STYLE_DYNAMIC_CIRCLE_1"
alias "v15_atx_select_white" "alias v15_atx_color v15_atx_white;alias v15_atx_next_color v15_atx_select_cyan;v15_preview_white;echo ATX_COLOR_WHITE"
alias "v15_atx_select_cyan" "alias v15_atx_color v15_atx_cyan;alias v15_atx_next_color v15_atx_select_green;v15_preview_cyan;echo ATX_COLOR_CYAN"
alias "v15_atx_select_green" "alias v15_atx_color v15_atx_green;alias v15_atx_next_color v15_atx_select_pink;v15_preview_green;echo ATX_COLOR_GREEN"
alias "v15_atx_select_pink" "alias v15_atx_color v15_atx_pink;alias v15_atx_next_color v15_atx_select_white;v15_preview_pink;echo ATX_COLOR_PINK"
alias "v15_atx_next_style" "v15_atx_select_dynamic"
alias "v15_atx_next_color" "v15_atx_select_cyan"
alias "v15_preview_style_on" "alias v15_preview_circle v15_render_circle;alias v15_preview_dynamic v15_render_dynamic;alias v15_preview_split v15_render_split"
alias "v15_preview_color_on" "alias v15_preview_white v15_atx_white;alias v15_preview_cyan v15_atx_cyan;alias v15_preview_green v15_atx_green;alias v15_preview_pink v15_atx_pink"
alias "v15_preview_style_off" "alias v15_preview_circle noop;alias v15_preview_dynamic noop;alias v15_preview_split noop"
alias "v15_preview_color_off" "alias v15_preview_white noop;alias v15_preview_cyan noop;alias v15_preview_green noop;alias v15_preview_pink noop"
// ALT: +fire/-fire direkt. Unveraenderter Inhalt in v15_fire_down/up; nur Vorschauzustand ergaenzt.
alias "v15_fire_down" "look0;+attack;alias sens_shot v15_sens_fire;alias sens_guard v15_sens_fire;alias cross_apply shot_circle_now;alias color_apply color_shot;shot_circle_now;sensitivity 1.33;alias selection_shot_guard shot_circle_now;q_fire_gate"
alias "v15_fire_up" "-attack;alias sens_shot sens_space;alias sens_guard noop;alias cross_apply cross_idle_apply;alias color_apply selected_color;cross_idle_apply;sens_space;alias selection_shot_guard noop"
alias "+fire" "v15_preview_style_on;v15_preview_color_on;v15_fire_down"
alias "-fire" "v15_preview_style_off;v15_preview_color_off;v15_fire_up"
v15_preview_style_off
v15_preview_color_off
// ALT: arrows_edit = alias arrow_up next_cross;alias arrow_down prev_cross;alias arrow_left prev_color;alias arrow_right cr_x
alias "arrows_edit" "alias arrow_up next_cross;alias arrow_down v15_atx_next_style;alias arrow_left cr_x;alias arrow_right v15_atx_next_color"

// NEU: F besitzt das Granatenrad nur nach Start im ALT-Granatenmodus.
// SPACE bleibt separat gespeichert; normales Rad: hoch Nachladen, runter frei / mit SPACE Jump.
// Stabile Plus-Binds: ein spaetes Rad-Release darf nach Moduswechsel kein fremdes -jump erzeugen.
alias "v15_wheel_normal" "alias v15_wheel_up_action v15_wheel_reload;alias v15_wheel_down_action noop"
alias "v15_wheel_space" "alias v15_wheel_up_action v15_wheel_reload;alias v15_wheel_down_action v15_wheel_jump"
alias "v15_wheel_base" "v15_wheel_normal"
alias "v15_wheel_grenades" "alias v15_wheel_up_action v15_grenade_next;alias v15_wheel_down_action v15_grenade_prev"
alias "v15_wheel_space_on" "v15_wheel_space"
alias "v15_wheel_space_off" "v15_wheel_normal"
alias "v15_wheel_f_on" "-reload;alias v15_wheel_up_release noop;v15_wheel_jump_end;v15_wheel_grenades;alias v15_wheel_space_on v15_wheel_grenades;alias v15_wheel_space_off v15_wheel_grenades"
alias "v15_wheel_f_off" "alias v15_wheel_space_on v15_wheel_space;alias v15_wheel_space_off v15_wheel_normal;v15_wheel_base"
alias "v15_wheel_reload" "+reload;alias v15_wheel_up_release v15_wheel_reload_end"
alias "v15_wheel_reload_end" "-reload;alias v15_wheel_up_release noop"
alias "v15_jump_release_b" "jump_check_n"
alias "v15_jump_release_n" "jump_b_state"
alias "v15_wheel_jump" "+jump;alias v15_jump_release_b +jump;alias v15_jump_release_n +jump;alias v15_wheel_down_release v15_wheel_jump_end"
alias "v15_wheel_jump_end" "alias v15_jump_release_b jump_check_n;alias v15_jump_release_n jump_b_state;jump_check_b;alias v15_wheel_down_release noop"
alias "v15_wheel_up_release" "noop"
alias "v15_wheel_down_release" "noop"
alias "+v15_wheel_up" "v15_wheel_up_action"
alias "-v15_wheel_up" "v15_wheel_up_release"
alias "+v15_wheel_down" "v15_wheel_down_action"
alias "-v15_wheel_down" "v15_wheel_down_release"
// ALT: -jump_n = alias jump_check_n -jump;jump_b_state
alias "-jump_n" "alias jump_check_n -jump;v15_jump_release_n"
// Ring: Flash -> Smoke -> Molo -> HE -> Decoy -> Flash. Fehlende Slots werden mit Fallback aufgefangen.
// Reine CFG kann Inventar nicht abfragen: bei fehlenden Granaten sind Wiederholungen moeglich.
alias "v15_grenade_flash" "look0;slot3;slot9;slot6;slot10;slot8;slot7;look1;alias v15_grenade_next v15_grenade_smoke;alias v15_grenade_prev v15_grenade_decoy"
alias "v15_grenade_smoke" "look0;slot3;slot7;slot9;slot6;slot10;slot8;look1;alias v15_grenade_next v15_grenade_molo;alias v15_grenade_prev v15_grenade_flash"
alias "v15_grenade_molo" "look0;slot3;slot8;slot7;slot9;slot6;slot10;look1;alias v15_grenade_next v15_grenade_he;alias v15_grenade_prev v15_grenade_smoke"
alias "v15_grenade_he" "look0;slot3;slot10;slot8;slot7;slot9;slot6;look1;alias v15_grenade_next v15_grenade_decoy;alias v15_grenade_prev v15_grenade_molo"
alias "v15_grenade_decoy" "look0;slot3;slot6;slot10;slot8;slot7;slot9;look1;alias v15_grenade_next v15_grenade_flash;alias v15_grenade_prev v15_grenade_he"
alias "v15_grenade_next" "v15_grenade_smoke"
alias "v15_grenade_prev" "v15_grenade_decoy"
// ALT: f_gren_down = q_cancel;buy flashbang;alias check_f equip_f;alias f_up f_gren_up;equip_f;alias f_commit f_latch
alias "f_gren_down" "q_cancel;buy flashbang;alias check_f noop;alias f_up f_gren_up;equip_f;alias v15_grenade_next v15_grenade_smoke;alias v15_grenade_prev v15_grenade_decoy;alias f_commit f_latch;v15_wheel_f_on"
// ALT: f_gren_up = alias check_f check_space;alias f_up noop;best_weapon;alias f_commit noop
alias "f_gren_up" "alias check_f check_space;alias f_up noop;best_weapon;alias f_commit noop;v15_wheel_f_off"
// ALT: f_stay = alias check_f check_space;alias f_up noop;look0;alias f_commit noop
alias "f_stay" "alias check_f check_space;alias f_up noop;look0;alias f_commit noop;v15_wheel_f_off"
// ALT: +jumpp/-jumpp schrieben die Radbelegung direkt und konnten F ueberschreiben.
alias "+jumpp" "alias v15_wheel_base v15_wheel_space;v15_wheel_space_on;alias sens_space sensx;alias quick_choice quick_knife;q_space_gate;sensitivity 1;sensitivity_y_scale 2;sens_guard;space_down_trace"
alias "-jumpp" "alias v15_wheel_base v15_wheel_normal;v15_wheel_space_off;v15_wheel_jump_end;alias sens_space sens0;alias quick_choice quick_pistol;q_normal_gate;sensitivity 1;sensitivity_y_scale 1.5;sens_guard;space_up_trace"

// NEU: Nutzerupdate 19.10.2026: Basis 1, Y 1.5; SPACE aendert Y auf 2.
// ALT: sens0 = sensitivity 1.33; sensx = sensitivity 2.1; sensitivity_y_scale 1.33
alias "sens0" "sensitivity 1"
alias "sensx" "sensitivity 1"
alias "v15_sens_fire" "sensitivity 1.33"
alias "space_down_log" "echo SPACE_Y_2__SENS_1_OR_SHOT_1.33;sensitivity;sensitivity_y_scale"
alias "space_up_log" "echo SPACE_Y_1.5__SENS_1_OR_SHOT_1.33;sensitivity;sensitivity_y_scale"
sensitivity 1
sensitivity_y_scale 1.5

// NEU: Gewuenschte Werte; cheat-markierte Befehle bleiben serverabhaengig.
snd_mixahead 0.02
fov_cs_debug 90
r_drawtracers_firstperson false
r_drawparticles false

// NEU: Reload und Konsolenbericht muessen die aktuelle Version behalten.
// ALT: fix = exec LEETED_14.cfg
alias "fix" "exec LEETED_15.cfg"
// ALT: report_refresh = log_flags General -donotecho;clear;exec LEETED_13_8_report.cfg
alias "report_refresh" "log_flags General -donotecho;clear;exec LEETED_15_report.cfg"
alias "keys15" "echo ALT_RIGHT_ATX_COLOR__ALT_DOWN_ATX_STYLE__ALT_UP_BASE_STYLE__ALT_LEFT_BASE_COLOR;echo V_TALK__ALT_V_RECEIVE_MUTE__B_E_BUY_HOLD__ALT_F_WHEEL_GRENADES"
alias "functions15" "echo VOICE_NORMAL_50_TALK_10_MUTED_0__MIC_SEPARATE;echo F_RELEASE_RESTORES_WHEEL__ALT_FIRST_RETAINS_GRENADE;echo ATX_SELECTION_SEPARATE__FIRE_RECOIL_ON_RELEASE_OFF;echo FULL_HELP_LEETED_V15_README"

// Abschliessende Tastenbelegungen und Funktionsliste.
exec LEETED_15_bindings.cfg
