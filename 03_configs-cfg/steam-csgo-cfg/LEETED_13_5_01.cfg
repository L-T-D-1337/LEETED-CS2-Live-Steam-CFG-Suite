// NEU v10: Inspect bei folgenden Tastendruecken erlauben; startet selbst keine Animation.
alias "inspect_on" "alias look1 +lookatweapon;alias inspect_toggle inspect_off;echo INSPECT_ON"
// NEU v10: Automatisches Inspect deaktivieren und vorhandene Eingabe freigeben.
alias "inspect_off" "alias look1 noop;look0;alias inspect_toggle inspect_on;echo INSPECT_OFF"
// NEU v10: Inspect-Schalter; Startwert folgt am Ende.
alias "inspect_toggle" "inspect_on"
// NEU v10: Automatische Farbwechsel sperren; J bleibt zur bewussten Farbwahl frei.
alias "color_lock_on" "alias automatic_white noop;alias color_restore selected_color;alias color_lock_toggle color_lock_off;refresh_crosshair;echo COLOR_LOCK_ON"
// NEU v10: Alten automatischen Weiss-Effekt von movecross erlauben; bewusste J-Auswahl separat behalten.
alias "color_lock_off" "alias automatic_white legacy_white;alias color_restore croco;alias color_lock_toggle color_lock_on;refresh_crosshair;echo COLOR_LOCK_OFF"
// NEU v10: Bewusst gewaehlte J-Farbe getrennt von automatischer Altfarbe speichern.
alias "selected_color" "rgb_red"
// NEU v10: Farbrueckstellung nach aktivem Farbschutz.
alias "color_restore" "selected_color"
// NEU v10: Nur bei deaktiviertem Farbschutz automatische Altfarbe Weiss setzen.
alias "legacy_white" "alias croco rgb_white"
// NEU v10: Farbschutz umschalten.
alias "color_lock_toggle" "color_lock_off"
// NEU v10: Farbschutz startet aktiv.
alias "automatic_white" "noop"
// NEU v10: Schussprofil beim Halten von Maus1 einschalten.
alias "shot_on" "alias shot_render shot_selected;alias shot_toggle shot_off;refresh_crosshair;echo SHOT_ON"
// NEU v10: Gewaehltes normales Crosshair auch beim Schiessen anzeigen, Recoil aus.
// ALT: alias "shot_off" "alias shot_render mycross;alias shot_toggle shot_on;refresh_crosshair;echo SHOT_OFF"
// NEU: Auswahlrenderer getrennt vom ausdruecklich leeren mycross.
alias "shot_off" "alias shot_render cross_saved;alias shot_toggle shot_on;refresh_crosshair;echo SHOT_OFF"
// NEU v10: Schussanzeige an/aus.
alias "shot_toggle" "shot_off"
// NEU v10: Weissen dynamischen Kreis auswaehlen.
alias "shot_circle" "alias shot_selected shape_fire;alias shot_style_toggle shot_t;refresh_crosshair;echo SHOT_CIRCLE_WHITE"
// NEU v10: Grosses rotes T mit Recoil auswaehlen.
alias "shot_t" "alias shot_selected shape_fire_t;alias shot_style_toggle shot_circle;refresh_crosshair;echo SHOT_T_RED"
// NEU v10: Kreis und T umschalten, normale Auswahl bleibt erhalten.
alias "shot_style_toggle" "shot_t"
// NEU v10: Standard-Schussprofil Kreis.
alias "shot_selected" "shape_fire"
// NEU v10: Schussanzeige ist standardmaessig aktiv.
alias "shot_render" "shot_selected"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_circle_part_1" "crosshair 1;cl_crosshairstyle 1;cl_crosshair_length 2;cl_crosshair_thickness 1;cl_crosshair_gap 4;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 0;cl_crosshairdot 1"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_circle_part_2" "cl_crosshair_t 1;cl_crosshair_recoil 1;cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;cl_crosshaircolor_b 255;cl_crosshair_dynamic_spread_limit 255"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_circle_part_3" "cl_crosshair_dynamic_splitdist 0;cl_crosshair_dynamic_splitalpha_innermod 0;cl_crosshair_dynamic_splitalpha_outermod 0.3;cl_crosshair_dynamic_maxdist_splitratio 0"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_circle_part_4" "cl_crosshair_screen_height 1024"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_t_part_1" "crosshair 1;cl_crosshairstyle 4;cl_crosshair_length 255;cl_crosshair_thickness 1;cl_crosshair_gap 1;cl_crosshaircolor_a 77;cl_crosshair_drawoutline 1;cl_crosshairdot 0"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_t_part_2" "cl_crosshair_t 1;cl_crosshair_recoil 1;cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0;cl_crosshair_dynamic_spread_limit 255;cl_crosshair_dynamic_splitdist 0"
// NEU v10: Kurzer Schussprofil-Teil; Werte konfigurierbar in options.json.
alias "shot_t_part_3" "cl_crosshair_dynamic_splitalpha_innermod 0;cl_crosshair_dynamic_splitalpha_outermod 0.3;cl_crosshair_dynamic_maxdist_splitratio 0;cl_crosshair_screen_height 1024"
// NEU v10: Grosses rotes T wie frueher angenaehert; neue maximale Laenge 255 statt alter 1000.
alias "shape_fire_t" "shot_t_part_1;shot_t_part_2;shot_t_part_3"
// NEU v10: SPACE-Zustand merken; keine Bombe beim folgenden CapsLock-Druck abwerfen.
alias "space_press_state" "alias sens_check_space sens_held;alias check_space equip_z;alias drop_dispatch space_sneak_press"
// NEU v10: SPACE-Ende: Standardfunktion Bombendrop und sprint1 wiederherstellen.
alias "space_release_state" "alias sens_check_space sens_check_quick;alias check_space best_weapon;alias drop_dispatch bomb_down;space_sneak_reset"
// NEU v10: Angeforderter SPACE-Modus ruft vorhandenes sprint0 auf.
alias "space_sneak_on" "sprint0;alias space_sneak_toggle space_sneak_off;alias space_move_hold sprint0;echo SPACE_SPRINT0"
// NEU v10: Zweiter Druck stellt vorhandenes sprint1 wieder her.
alias "space_sneak_off" "sprint1;alias space_sneak_toggle space_sneak_on;alias space_move_hold sprint1;echo SPACE_SPRINT1"
// NEU v10: Naechster Druck waehrend SPACE aktiviert sprint0.
alias "space_sneak_toggle" "space_sneak_on"
// NEU v10: SPACE-Release beendet den Toggle immer; SHIFT bleibt danach normal nutzbar.
alias "space_sneak_reset" "sprint1;alias space_sneak_toggle space_sneak_on;alias space_move_hold noop"
// NEU v10: Temporaren SPACE-Modus nach SHIFT-Release erneut anwenden.
alias "space_move_hold" "noop"
// NEU v10: Tastendruck als SPACE-Modusschalter merken: Release darf keine Bombe droppen.
alias "space_sneak_press" "alias drop_release noop;space_sneak_toggle"
// NEU v10: Bombentaste im Normalmodus.
alias "drop_dispatch" "bomb_down"
// NEU v10: Release-Aktion wird beim Tastendruck gespeichert.
alias "drop_release" "noop"
// NEU v10: Latch verhindert mehrfaches Umschalten beim Halten.
alias "drop_press" "drop_once"
// NEU v10: Genau eine Bomben-/Toggle-Aktion pro Tastendruck.
alias "drop_once" "alias drop_press noop;drop_dispatch"
// NEU v10: Normale Bombenauswahl; passende Release-Aktion auch bei spaeterem SPACE merken.
alias "bomb_down" "alias drop_release bomb_up;cl_autohelp 1;slot3;slot5;look1"
// NEU v10: Vor Drop Bombe erneut waehlen: anderer Waffenwechsel waehrend Halten darf nicht Hauptwaffe droppen.
alias "bomb_up" "cl_autohelp 0;look0;slot3;slot5;drop;best_weapon"
// NEU v10: Maus1 startet nicht gehalten.
alias "fire_check_mouse" "fire_check_enter"
// NEU v10: Enter startet nicht gehalten.
alias "fire_check_enter" "fire_end"
// NEU v10: Gemeinsamen Angriffszustand aus beiden Tasten ableiten.
alias "fire_refresh" "fire_check_mouse"
// NEU v10: Mindestens eine Angriffstaste gehalten: Angriff und Schussanzeige.
alias "fire_hold" "+attack;alias refresh_crosshair crosshair_fire;atx1"
// NEU v10: Letzte Angriffstaste losgelassen: Angriff aus, gespeichertes Profil und Sens zurueck.
// ALT: alias "fire_end" "-attack;alias refresh_crosshair crosshair_idle;mycross;-h_color;sens1;sens_refresh"
// NEU: Auswahlrenderer getrennt vom ausdruecklich leeren mycross.
alias "fire_end" "-attack;alias refresh_crosshair crosshair_idle;cross_saved;-h_color;sens1;sens_refresh"
// NEU v10: Kauf-/Abbruchpfad: Angriff samt Anzeige und beiden Haltetasten-Flags beenden.
alias "fire_cancel" "alias fire_check_mouse fire_check_enter;alias fire_check_enter fire_end;fire_end"
// NEU v10: Enter nutzt dieselbe optionale Schussanzeige wie Maus1.
alias "+enter_fire" "alias fire_check_enter fire_hold;fire_refresh;shot_trace_down"
// NEU v10: Enter freigeben; Maus1 darf weiter schiessen.
alias "-enter_fire" "alias fire_check_enter fire_end;fire_refresh;shot_trace_up"
// NEU v10: Aktive Optionen und Auswahl ohne Zustandsaenderung ausgeben.
alias "mode_status" "echo LEETED_MODES;alias look1;alias automatic_white;alias shot_selected;alias shot_render;alias space_sneak_toggle;selection_status"
// LEETED v1.01.1_09 - freigegebene Reparatur, Altzeilen bleiben erhalten.
// NEU: LEETED: Diagnoseausgabe einschalten; keine Gameplay-Aenderung.
log_flags General -donotecho
