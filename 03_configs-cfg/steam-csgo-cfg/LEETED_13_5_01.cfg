// NEU: K: genau ein Wechsel pro Tastendruck.
alias "cross_pick_once" "alias cross_pick_action noop;next_cross"
// NEU: K-Wechsel ist nach Loslassen wieder bereit.
alias "cross_pick_action" "cross_pick_once"
// NEU: K-Tastendruck auf einmalige Auswahl leiten.
alias "+cross_pick" "cross_pick_action"
// NEU: K loslassen: naechsten Tastendruck erlauben, keine Auswahl aendern.
alias "-cross_pick" "alias cross_pick_action cross_pick_once"
// NEU: Standard-Sensitivitaet; Zoomwerte bleiben in vorhandenen sens-Aliasen.
