// NEU: Profil t: normales Profil, Schussfolgen AUS; konfigurierbar in options.json.
alias "shape_t" "crosshair 1;cl_crosshairstyle 4;cl_crosshair_length 255;cl_crosshair_thickness 1;cl_crosshair_gap 1;cl_crosshaircolor_a 137;cl_crosshair_drawoutline 1;cl_crosshairdot 0;cl_crosshair_t 1;cl_crosshair_recoil 0;cl_crosshair_screen_height 960"
// ALT: alias "shape_fire" "crosshair 1;cl_crosshairstyle 1;cl_crosshair_length 2;cl_crosshair_thickness 3;cl_crosshair_gap 2;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 1;cl_crosshairdot 1;cl_crosshair_t 1;cl_crosshair_recoil 1;cl_crosshair_screen_height 1024;cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0;cl_crosshair_dynamic_spread_limit 77;cl_crosshair_dynamic_splitdist 0;cl_crosshair_dynamic_splitalpha_innermod 0;cl_crosshair_dynamic_splitalpha_outermod 0.3;cl_crosshair_dynamic_maxdist_splitratio 0"
// NEU: Lange Schussprofil-Definition in kurze Teilaliase zerlegen; identische Reihenfolge und Werte.
