alias "shot_profile_2" "cl_crosshair_t 1;cl_crosshair_recoil 1;cl_crosshair_screen_height 1024;cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0;cl_crosshair_dynamic_spread_limit 77"
// NEU: Kurzer Schussprofil-Teil 3 aus dem Code; Laenge angepasst auf 2.
