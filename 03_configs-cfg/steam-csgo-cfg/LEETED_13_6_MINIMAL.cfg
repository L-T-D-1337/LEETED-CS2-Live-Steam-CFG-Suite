// LEETED 13.6 MINIMAL: nach vollstaendiger 13.5 laden, alle Tasten frei.
// Aendert nur sechs Aliasse. Basis/Schuss-Sens 1.33 und Bindings bleiben erhalten.
// Ohne SPACE: Pistole bzw. Messer-Ersatz ohne Inspect. Mit SPACE: Messer mit Inspect.
// Halb-Outline: echtes volles Kreuz = trill; langes T = crosst.
// ALT: alias "shape_trill" "crosshair 1;cl_crosshairstyle 4;cl_crosshair_length 1;cl_crosshair_thickness 1;cl_crosshair_gap 1;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 1;cl_crosshairdot 0;cl_crosshair_t 0;cl_crosshair_recoil 0;cl_crosshair_screen_height 960"
// NEU: shape_trill
alias "shape_trill" "crosshair 1;cl_crosshairstyle 4;cl_crosshair_length 1;cl_crosshair_thickness 1;cl_crosshair_gap 1;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 2;cl_crosshairdot 0;cl_crosshair_t 0;cl_crosshair_recoil 0;cl_crosshair_screen_height 960"
// ALT: alias "shape_t" "crosshair 1;cl_crosshairstyle 4;cl_crosshair_length 255;cl_crosshair_thickness 1;cl_crosshair_gap 1;cl_crosshaircolor_a 137;cl_crosshair_drawoutline 1;cl_crosshairdot 0;cl_crosshair_t 1;cl_crosshair_recoil 0;cl_crosshair_screen_height 960"
// NEU: shape_t
alias "shape_t" "crosshair 1;cl_crosshairstyle 4;cl_crosshair_length 255;cl_crosshair_thickness 1;cl_crosshair_gap 1;cl_crosshaircolor_a 137;cl_crosshair_drawoutline 2;cl_crosshairdot 0;cl_crosshair_t 1;cl_crosshair_recoil 0;cl_crosshair_screen_height 960"
// ALT: alias "sensx" "sensitivity 1.87"
// NEU: sensx
alias "sensx" "sensitivity 2.1"
// ALT: alias "+jumpp" "bind mwheeldown +jump;alias sens_space sensx;alias quick_choice quick_knife;quick_held;sensitivity 1.87;sens_guard;space_down_trace"
// NEU: +jumpp
alias "+jumpp" "bind mwheeldown +jump;alias sens_space sensx;alias quick_choice quick_knife;quick_held;sensitivity 2.1;sens_guard;space_down_trace"
// ALT: alias "space_down_log" "echo SPACE_DOWN_EXPECT_1.87_OR_SHOT_1.33;sensitivity"
// NEU: space_down_log
alias "space_down_log" "echo SPACE_DOWN_EXPECT_2.1_OR_SHOT_1.33;sensitivity"
// ALT: alias "quick_pistol" "look0;slot3;slot2;look1"
// NEU: quick_pistol
alias "quick_pistol" "look0;slot3;slot2"
// NEU: Gespeichertes Profil anwenden, Auswahl/Zyklus nicht weiterschalten.
cross_apply
sens_refresh
echo LEETED_13_6_MINIMAL_READY

// ALT: alias "fix" "exec LEETED_13_5.cfg"
// NEU: Auch Neuladen behaelt das komplette Update.
alias "fix" "exec LEETED_13_6.cfg"
echo LEETED_v1.01.1_13_6_END

// NEU: Crosshair-Korrektur nach allen bisherigen Definitionen.
exec LEETED_13_7_CROSS_FIX.cfg
